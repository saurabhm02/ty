[package]
name = "chotu"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chotu_lib"
# staticlib/cdylib are only needed for mobile builds; re-add them if you target iOS/Android.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-openai = { version = "0.42.0", features = ["chat-completion"] }
log = "0.4.34"
env_logger = "0.11.11"
dotenvy = "0.15.7"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["cookies", "json"] }
scraper = { version = "0.20" }
readability = "0.3"
url="2"
futures="0.3"
uuid= { version="1", features = ["v4"] }
chrono="0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.23"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
accessibility = "0.2"
core-foundation = "0.10"
arboard = "3"
enigo = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSArray", "NSDictionary", "NSString", "NSError", "NSObject"] }
objc2-vision = { version = "0.3", features = ["std", "VNRecognizeTextRequest", "VNRequestHandler", "VNRequest", "VNObservation"] }
tauri-nspanel = "2.1"
core-graphics = "0.25"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
